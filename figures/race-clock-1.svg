<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Liberation Sans, Arial, sans-serif">
  <title>the war of the beams, step 2: Aug–Oct</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f2f2f2"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7cc4ff"/></marker></defs>
  <circle cx="150.0" cy="182.0" r="9" fill="#f2f2f2" stroke="#1d1d1d" stroke-width="2"/>
  <text x="130.0" y="190.0" font-size="24" text-anchor="end" fill="#f2f2f2" font-weight="bold" font-style="normal">Aug–Oct</text>
  <text x="174.0" y="190.0" font-size="25" text-anchor="start" fill="#ff8a8a" font-weight="normal" font-style="normal">ASPIRIN: find the modulation, add the dots</text>
  <text x="174.0" y="224.0" font-size="22" text-anchor="start" fill="#c4c4c4" font-weight="normal" font-style="normal">the beam is not bent — it is misread</text>
