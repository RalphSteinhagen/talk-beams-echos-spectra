<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Liberation Sans, Arial, sans-serif">
  <title>the war of the beams, step 1: Jun 1940</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f2f2f2"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7cc4ff"/></marker></defs>
  <line x1="150" y1="20" x2="150" y2="530" stroke="#c4c4c4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="150.0" y="554.0" font-size="18" text-anchor="middle" fill="#c4c4c4" font-weight="normal" font-style="italic">weeks, not years</text>
  <circle cx="150.0" cy="52.0" r="9" fill="#f2f2f2" stroke="#1d1d1d" stroke-width="2"/>
  <text x="130.0" y="60.0" font-size="24" text-anchor="end" fill="#f2f2f2" font-weight="bold" font-style="normal">Jun 1940</text>
  <text x="174.0" y="60.0" font-size="25" text-anchor="start" fill="#8fe3a8" font-weight="normal" font-style="normal">Knickebein: fly the equisignal, drop at the crossing</text>
  <text x="174.0" y="94.0" font-size="22" text-anchor="start" fill="#c4c4c4" font-weight="normal" font-style="normal">found by R. V. Jones's team</text>
</svg>
