<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 420" width="1500" height="420" font-family="Liberation Sans, Arial, sans-serif">
  <title>the escalation of the Battle of the Beams</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f2f2f2"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7cc4ff"/></marker></defs>
  <rect x="30.0" y="60.0" width="210.0" height="110.0" rx="10" fill="#2e2e2e" stroke="#7cc4ff" stroke-width="2.5"/>
  <text x="135.0" y="108.0" font-size="24" text-anchor="middle" fill="#7cc4ff" font-weight="bold" font-style="normal">navigation</text>
  <text x="135.0" y="138.0" font-size="24" text-anchor="middle" fill="#7cc4ff" font-weight="bold" font-style="normal">transmission</text>
  <line x1="246.0" y1="115.0" x2="276.0" y2="115.0" stroke="#f2f2f2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="282.0" y="60.0" width="210.0" height="110.0" rx="10" fill="#2e2e2e" stroke="#9ecbff" stroke-width="2.5"/>
  <text x="387.0" y="108.0" font-size="24" text-anchor="middle" fill="#9ecbff" font-weight="bold" font-style="normal">intercept</text>
  <text x="387.0" y="138.0" font-size="24" text-anchor="middle" fill="#9ecbff" font-weight="bold" font-style="normal">listen, DF</text>
  <line x1="498.0" y1="115.0" x2="528.0" y2="115.0" stroke="#f2f2f2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="534.0" y="60.0" width="210.0" height="110.0" rx="10" fill="#2e2e2e" stroke="#9ecbff" stroke-width="2.5"/>
  <text x="639.0" y="108.0" font-size="24" text-anchor="middle" fill="#9ecbff" font-weight="bold" font-style="normal">analyse</text>
  <text x="639.0" y="138.0" font-size="24" text-anchor="middle" fill="#9ecbff" font-weight="bold" font-style="normal">modulation, timing</text>
  <line x1="750.0" y1="115.0" x2="780.0" y2="115.0" stroke="#f2f2f2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="786.0" y="60.0" width="210.0" height="110.0" rx="10" fill="#2e2e2e" stroke="#ffd866" stroke-width="2.5"/>
  <text x="891.0" y="108.0" font-size="24" text-anchor="middle" fill="#ffd866" font-weight="bold" font-style="normal">understand the</text>
  <text x="891.0" y="138.0" font-size="24" text-anchor="middle" fill="#ffd866" font-weight="bold" font-style="normal">receiver / operator</text>
  <line x1="1002.0" y1="115.0" x2="1032.0" y2="115.0" stroke="#f2f2f2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1038.0" y="60.0" width="210.0" height="110.0" rx="10" fill="#2e2e2e" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="1143.0" y="108.0" font-size="24" text-anchor="middle" fill="#ff8a8a" font-weight="bold" font-style="normal">jam · imitate</text>
  <text x="1143.0" y="138.0" font-size="24" text-anchor="middle" fill="#ff8a8a" font-weight="bold" font-style="normal">· spoof</text>
  <line x1="1254.0" y1="115.0" x2="1284.0" y2="115.0" stroke="#f2f2f2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1290.0" y="60.0" width="210.0" height="110.0" rx="10" fill="#2e2e2e" stroke="#c4c4c4" stroke-width="2.5"/>
  <text x="1395.0" y="108.0" font-size="24" text-anchor="middle" fill="#c4c4c4" font-weight="bold" font-style="normal">counter-</text>
  <text x="1395.0" y="138.0" font-size="24" text-anchor="middle" fill="#c4c4c4" font-weight="bold" font-style="normal">countermeasure</text>
  <text x="750.0" y="230.0" font-size="23" text-anchor="middle" fill="#f2f2f2" font-weight="normal" font-style="normal">Knickebein (1940) → X-Gerät → Y-Gerät: equisignal beams → precise timing/filtering → ranging</text>
  <text x="750.0" y="258.8" font-size="23" text-anchor="middle" fill="#f2f2f2" font-weight="normal" font-style="normal">the decisive problem is not transmitter power: it is what the receiver and its operator will do with the waveform</text>
  <path d="M 1300 180 L 1300 330 L 240 330 L 240 180" stroke="#ff8a8a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="10 8"/>
  <text x="750.0" y="365.0" font-size="22" text-anchor="middle" fill="#ff8a8a" font-weight="normal" font-style="italic">… and the cycle restarts with the next waveform</text>
</svg>
