<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 660" width="690" height="660" font-family="Liberation Sans, Arial, sans-serif">
  <title>who meant the signal: ever less intended</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f2f2f2"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7cc4ff"/></marker></defs>
  <rect x="8.0" y="30.0" width="300.0" height="72.0" rx="10" fill="#2e2e2e" stroke="#7cc4ff" stroke-width="2.5"/>
  <text x="158.0" y="77.0" font-size="29" text-anchor="middle" fill="#7cc4ff" font-weight="bold" font-style="normal">communications</text>
  <text x="330.0" y="78.0" font-size="37" text-anchor="start" fill="#f2f2f2" font-weight="normal" font-style="normal">meant for you</text>
  <rect x="8.0" y="160.0" width="300.0" height="72.0" rx="10" fill="#2e2e2e" stroke="#9ecbff" stroke-width="2.5"/>
  <text x="158.0" y="207.0" font-size="29" text-anchor="middle" fill="#9ecbff" font-weight="bold" font-style="normal">radar</text>
  <text x="330.0" y="187.0" font-size="37" text-anchor="start" fill="#f2f2f2" font-weight="normal" font-style="normal">meant to</text>
  <text x="330.0" y="229.0" font-size="37" text-anchor="start" fill="#f2f2f2" font-weight="normal" font-style="normal">come back</text>
  <rect x="8.0" y="290.0" width="300.0" height="72.0" rx="10" fill="#2e2e2e" stroke="#ffd866" stroke-width="2.5"/>
  <text x="158.0" y="337.0" font-size="29" text-anchor="middle" fill="#ffd866" font-weight="bold" font-style="normal">SIGINT</text>
  <text x="330.0" y="317.0" font-size="37" text-anchor="start" fill="#f2f2f2" font-weight="normal" font-style="normal">meant for</text>
  <text x="330.0" y="359.0" font-size="37" text-anchor="start" fill="#f2f2f2" font-weight="normal" font-style="normal">someone else</text>
  <rect x="8.0" y="420.0" width="300.0" height="72.0" rx="10" fill="#2e2e2e" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="158.0" y="467.0" font-size="29" text-anchor="middle" fill="#ff8a8a" font-weight="bold" font-style="normal">TEMPEST</text>
  <text x="330.0" y="447.0" font-size="37" text-anchor="start" fill="#f2f2f2" font-weight="normal" font-style="normal">never meant</text>
  <text x="330.0" y="489.0" font-size="37" text-anchor="start" fill="#f2f2f2" font-weight="normal" font-style="normal">to leave</text>
  <rect x="8.0" y="550.0" width="300.0" height="72.0" rx="10" fill="#2e2e2e" stroke="#8fe3a8" stroke-width="2.5"/>
  <text x="158.0" y="597.0" font-size="29" text-anchor="middle" fill="#8fe3a8" font-weight="bold" font-style="normal">passive diagnostics</text>
  <text x="330.0" y="577.0" font-size="37" text-anchor="start" fill="#f2f2f2" font-weight="normal" font-style="normal">nobody meant it:</text>
  <text x="330.0" y="619.0" font-size="37" text-anchor="start" fill="#f2f2f2" font-weight="normal" font-style="normal">a state</text>
  <path d="M 636 24 L 636 640" stroke="#c4c4c4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="656" y="330" font-size="23" fill="#c4c4c4" transform="rotate(90 656 330)" text-anchor="middle">ever less intended</text>
</svg>
